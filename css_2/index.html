<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pink Handmade Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header id="id" class="class" data-id="header">
    <h1>Glimmung &lt;3</h1>
    <p>Store inspired by <cite>Etsy</cite> for handmade products</p>
</header>

<section class="class" title="Featured products" data-section="products">
    <h2>Featured Products</h2>

    <table class="class" id="table" data-table="products">
        <tr>
            <td colspan="2"><strong>Accessories</strong></td>
        </tr>
        <tr>
            <td>
                Rings 💍 <br><br>
                <img src="ring.jpg" alt="Ring 1" width="100" class="class" data-product="ring1">
                <img src="ring2.jpg" alt="Ring 2" width="100" class="class" data-product="ring2">
            </td>

            <td rowspan="2">
                Handmade💕 <br><br>
                <img src="handmade.jpg" alt="Handmade process" width="140" class="class" data-product="handmade">
                <img src="handmade2.jpg" alt="Handmade process" width="140" class="class" data-product="handmade">
                
            </td>
        </tr>
        <tr>
            <td>
                Bracelets ✨ <br><br>
                <img src="bracelet.jpg" alt="Bracelet 1" width="100" class="class" data-product="bracelet1">
                <img src="bracelet2.jpg" alt="Bracelet 2" width="100" class="class" data-product="bracelet2">
            </td>
        </tr>
    </table>

    <p>Example discount code:</p>
    <p class="code">PINK10</p>
</section>

<section class="class" id="form-section" data-form="contact">
    <h2>Contact Us</h2>

    <form action="submit.html" method="post" class="class" data-action="send">
        <label>Name:</label>
        <input type="text" name="name" required>

        <label>Message:</label>
        <textarea name="message"></textarea>

        <label>
            <input type="checkbox" name="newsletter">
            Subscribe to our newsletter 💌
        </label>

        <input type="submit" value="Send">
    </form>
</section>

<section class="class" id="media" data-media="true">
    <h2>Multimedia</h2>

    <img src="Thanks For Following &lt;3.gif" alt="Thanks for following" width="300" class="class" data-image="thankyou">

    <video  id ="video" width="640" height="360" controls>
  <source src="intro.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>

</section>

<section class="class" id="links" data-links="navigation">
    <h2>Links</h2>

    <a href="https://www.etsy.com" target="_blank">Visit Etsy</a><br><br>
    <a href="about.html">About Us</a>
</section>


<footer class="class" id="footer" data-footer="end">
    <p>© 2026 Pink Handmade Store</p>
</footer>

</body>
</html>
